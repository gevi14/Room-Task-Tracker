  function closeActivity() {
    const overlay = $("#activity-overlay");
    overlay.classList.remove("open");
    overlay.innerHTML = "";
  }
  function renderActiveCyclesSection() {
    const section = document.getElementById("active-cycles-section");
    if (!section) return;
    const activeKeys = Object.keys(cycles || {}).filter(k => cycles[k] && cycles[k].startDate);
    if (activeKeys.length === 0) {
      section.innerHTML = `
        <div class="cycles-section">
          <div class="cycles-header">Active cycles</div>
          <div class="cycles-empty">No active cycles. Click ▶ Start cycle on any task above to begin tracking.</div>
        </div>`;
      return;
    }
    const today = isoDate(new Date());
    const rows = activeKeys.map(k => {
      const job = JOBS.find(j => j.key === k);
      const label = job ? job.label : k;
      const c = cycles[k];
      const s = jobStatsAcrossAll(k);
      const total = Math.max(1, daysBetween(c.startDate, c.targetDate));
      const elapsed = daysBetween(c.startDate, today);
      const remaining = daysBetween(today, c.targetDate);
      // Same time-left coloring as the stat-card cycle chip
      let chipStyle, remainingTxt;
      if (remaining < 0) {
        chipStyle = "color:rgb(217,69,69);background:rgba(217,69,69,0.22)";
        remainingTxt = `${Math.abs(remaining)}d overdue`;
      } else {
        const pctLeft = Math.min(100, Math.round((remaining / total) * 100));
        const color = pctToRGB(pctLeft);
        const bgRgba = color.replace("rgb(", "rgba(").replace(")", ",0.20)");
        chipStyle = `color:${color};background:${bgRgba}`;
        remainingTxt = remaining === 0 ? "due today" : `${remaining}d left`;
      }
      return `
        <div class="cycle-row">
          <div class="cycle-row-main">
            <div class="cycle-row-title">${label} <span class="cycle-row-pct">${s.pct}%</span></div>
            <div class="cycle-row-sub">
              Started ${shortDate(c.startDate)} (${elapsed}d ago) ·
              Target ${shortDate(c.targetDate)} ·
              by ${c.startedBy || "—"}
              <span class="cyc-chip" style="margin-left:6px;${chipStyle}">${remainingTxt}</span>
            </div>
          </div>
          <div class="cycle-row-actions">
            <button class="cycle-edit" data-cycle-edit="${k}" title="Change dates">Edit</button>
            <button class="cycle-end"  data-cycle-end="${k}"  title="End this cycle now">End</button>
          </div>
        </div>`;
    }).join("");
    section.innerHTML = `
      <div class="cycles-section">
        <div class="cycles-header">Active cycles (${activeKeys.length})</div>
        ${rows}
      </div>`;
  }
  document.getElementById("activity-btn").onclick = openActivity;

  // ---- Edit tasks (admin only) ----
  // Holds the in-progress edit; not saved until admin clicks "Save".
  let editingTasks = null;

  function newJobKey() { return "task_" + Math.random().toString(36).slice(2, 10); }

  function openEditTasks() {
    if (currentRole !== "admin") { showToast("Admin only"); return; }
    editingTasks = JOBS.map(j => ({ key: j.key, label: j.label, deleted: false, isNew: false }));
    renderEditTasks();
  }
  function closeEditTasks() {
    editingTasks = null;
    const overlay = $("#edit-tasks-overlay");
    overlay.classList.remove("open");
    overlay.innerHTML = "";
  }
  function renderEditTasks() {
    const overlay = $("#edit-tasks-overlay");
    overlay.innerHTML = `
      <div class="detail-modal">
        <div class="detail-head">
          <div>
            <h3>Edit tasks</h3>
            <div class="detail-sub">Rename, reorder, add, or remove the tasks shown for every room.</div>
          </div>
          <button class="close-btn" data-edit-tasks-close title="Close">×</button>
        </div>
        <div class="task-list" id="task-list"></div>
        <button id="task-add-btn" class="task-add">+ Add task</button>
        <p class="task-help">
          Removing a task hides it from the app but doesn't erase existing check-marks immediately —
          they become orphaned in the database and clear out over time. Reordering doesn't affect any data.
          Changes apply to every device within a second of saving.
        </p>
        <div class="task-footer">
          <button data-edit-tasks-close>Cancel</button>
          <button id="task-save-btn" class="primary">Save changes</button>
        </div>
      </div>`;
    overlay.classList.add("open");
    redrawTaskRows();
    document.getElementById("task-add-btn").onclick = () => {
      editingTasks.push({ key: newJobKey(), label: "", deleted: false, isNew: true });
      redrawTaskRows();
      // focus the newly added input
      const inputs = overlay.querySelectorAll(".task-row input[type='text']");
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
    document.getElementById("task-save-btn").onclick = saveTaskEdits;
  }
  function redrawTaskRows() {
    const list = document.getElementById("task-list");
    list.innerHTML = editingTasks.map((t, i) => `
      <div class="task-row${t.deleted ? " deleted" : ""}" data-idx="${i}">
        <input type="text" value="${(t.label || "").replace(/"/g,"&quot;")}" placeholder="Task name" ${t.deleted ? "disabled" : ""} />
        <button class="iconbtn" data-act="up"   ${i===0 ? "disabled" : ""} title="Move up">↑</button>
        <button class="iconbtn" data-act="down" ${i===editingTasks.length-1 ? "disabled" : ""} title="Move down">↓</button>
        <button class="iconbtn del-btn" data-act="del" title="${t.deleted ? "Undo delete" : "Delete"}">${t.deleted ? "↺" : "×"}</button>
      </div>`).join("");
    // Wire up per-row events
    list.querySelectorAll(".task-row").forEach(row => {
      const idx = +row.dataset.idx;
      const input = row.querySelector("input[type='text']");
      input.addEventListener("input", (e) => { editingTasks[idx].label = e.target.value; });
      row.querySelectorAll("button[data-act]").forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          if (act === "up" && idx > 0) {
            [editingTasks[idx-1], editingTasks[idx]] = [editingTasks[idx], editingTasks[idx-1]];
          } else if (act === "down" && idx < editingTasks.length - 1) {
            [editingTasks[idx+1], editingTasks[idx]] = [editingTasks[idx], editingTasks[idx+1]];
          } else if (act === "del") {
            // Truly removing a brand-new (unsaved) row is fine.
            // For existing tasks we toggle .deleted so admin can undo before saving.
            if (editingTasks[idx].isNew) {
              editingTasks.splice(idx, 1);
            } else {
              editingTasks[idx].deleted = !editingTasks[idx].deleted;
            }
          }
          redrawTaskRows();
        };
      });
    });
  }
  async function saveTaskEdits() {
    // Build the final array, dropping deleted items and trimming labels
    const finalItems = [];
    const seenKeys = new Set();
    for (const t of editingTasks) {
      if (t.deleted) continue;
      const label = (t.label || "").trim();
      if (!label) {
        showToast("Every task needs a name");
        return;
      }
      if (seenKeys.has(t.key)) {
        // very defensive — shouldn't happen
        continue;
      }
      seenKeys.add(t.key);
      finalItems.push({ key: t.key, label });
    }
    if (finalItems.length === 0) {
      showToast("Need at least one task");
      return;
    }
    const btn = document.getElementById("task-save-btn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      await setDoc(doc(db, "config", "jobs"), {
        items: finalItems,
        updatedAt: serverTimestamp(),
        updatedBy: displayName
      });
      logActivity("tasks-edit", { count: finalItems.length });
      showToast("Tasks updated");
      closeEditTasks();
    } catch (e) {
      console.error(e);
      showToast("Save failed: " + (e.message || e.code || ""));
      btn.disabled = false;
      btn.textContent = "Save changes";
    }
  }
  document.getElementById("edit-tasks-btn").onclick = openEditTasks;

  // ---- Cycle date-picker overlay (admin only) ----
  function openCycleEditor(jobKey) {
    if (currentRole !== "admin") { showToast("Admin only"); return; }
    const job = JOBS.find(j => j.key === jobKey);
    if (!job) return;
    const existing = cycles[jobKey] || {};
    const today = isoDate(new Date());
    // Default target = 14 days out if no existing target
    const defaultTarget = (() => {
      const d = new Date(); d.setDate(d.getDate() + 14); return isoDate(d);
    })();
    const startVal  = existing.startDate  || today;
    const targetVal = existing.targetDate || defaultTarget;
    const isEdit = !!(existing.startDate);
    const overlay = $("#cycle-overlay");
    overlay.innerHTML = `
      <div class="detail-modal cycle-modal" style="max-width:420px">
        <div class="detail-head">
          <div>
            <h3>${isEdit ? "Edit" : "Start"} cycle: ${job.label}</h3>
            <div class="detail-sub">${isEdit
              ? "Change the start and target dates for this task's current cycle."
              : "Set when this task cycle starts and when you want it complete."}</div>
          </div>
          <button class="close-btn" data-cycle-close title="Close">×</button>
        </div>
        <div class="form-row">
          <label for="cycle-start">Start date</label>
          <input id="cycle-start" type="date" value="${startVal}" />
        </div>
        <div class="form-row">
          <label for="cycle-target">Target complete-by</label>
          <input id="cycle-target" type="date" value="${targetVal}" min="${startVal}" />
        </div>
        <div class="cycle-footer">
          ${isEdit ? `<button id="cycle-clear-btn" style="margin-right:auto">Clear cycle</button>` : ""}
          <button data-cycle-close>Cancel</button>
          <button id="cycle-save-btn" class="primary">${isEdit ? "Save" : "Start"}</button>
        </div>
      </div>`;
    overlay.classList.add("open");
    // Keep target >= start as user edits start
    const startEl = document.getElementById("cycle-start");
    const targetEl = document.getElementById("cycle-target");
    startEl.addEventListener("change", () => {
      targetEl.min = startEl.value;
      if (targetEl.value && targetEl.value < startEl.value) targetEl.value = startEl.value;
    });
    document.getElementById("cycle-save-btn").onclick = async () => {
      const sd = startEl.value, td = targetEl.value;
      if (!sd || !td) { showToast("Pick both dates"); return; }
      if (td < sd) { showToast("Target must be on or after start"); return; }
      const btn = document.getElementById("cycle-save-btn");
      btn.disabled = true; btn.textContent = "Saving…";
      await startCycle(jobKey, sd, td);
      closeCycleEditor();
    };
    if (isEdit) {
      document.getElementById("cycle-clear-btn").onclick = async () => {
        if (!confirm(`Clear the active cycle for "${job.label}"? You can start a new one any time.`)) return;
        await closeCycle(jobKey, "reset");
        closeCycleEditor();
      };
    }
  }
  function closeCycleEditor() {
    const overlay = $("#cycle-overlay");
    overlay.classList.remove("open");
    overlay.innerHTML = "";
  }

  async function toggleJobColumn(jobKey) {
    const tower = getTower(ui.tower);
    const floor = getFloor(tower, ui.floor);
    const allDone = floor.rooms.every(r => isChecked(tower.id, r, jobKey));
    const value = !allDone;
    const batch = writeBatch(db);
    for (const r of floor.rooms) {
      const ref = doc(db, "completions", `${tower.id}-${r}-${jobKey}`);
      if (value) {
        batch.set(ref, { tower: tower.id, room: r, job: jobKey, doneBy: displayName, doneAt: serverTimestamp() });
      } else {
        batch.delete(ref);
      }
    }
    try {
      await batch.commit();
      logActivity(value ? "column-mark" : "column-clear", {
        tower: tower.id, floor: floor.num, job: jobKey, roomCount: floor.rooms.length
      });
    } catch (e) { console.error(e); showToast("Column update failed"); }
  }

  // ---- Event delegation for checkboxes, column toggle, and detail view ----
  document.addEventListener("click", (e) => {
    // Detail view: close button
    if (e.target.closest("[data-detail-close]")) {
      e.preventDefault();
      closeDetail();
      return;
    }
    // Detail view: backdrop click (clicking outside the modal)
    if (e.target.id === "detail-overlay") {
      closeDetail();
      return;
    }
    // Activity log: close button
    if (e.target.closest("[data-activity-close]")) {
      e.preventDefault();
      closeActivity();
      return;
    }
    if (e.target.id === "activity-overlay") {
      closeActivity();
      return;
    }
    // Active cycles section: Edit / End buttons (inside admin Activity overlay)
    const cycEdit = e.target.closest("[data-cycle-edit]");
    if (cycEdit) {
      e.preventDefault();
      closeActivity();
      openCycleEditor(cycEdit.dataset.cycleEdit);
      return;
    }
    const cycEnd = e.target.closest("[data-cycle-end]");
    if (cycEnd) {
      e.preventDefault();
      const jobKey = cycEnd.dataset.cycleEnd;
      const job = JOBS.find(j => j.key === jobKey);
      if (confirm(`End the active cycle for "${job ? job.label : jobKey}" now? You can start a new one any time.`)) {
        closeCycle(jobKey, "reset").then(() => renderActiveCyclesSection());
      }
      return;
    }
    // Edit-tasks: close button or backdrop
    if (e.target.closest("[data-edit-tasks-close]")) {
      e.preventDefault();
      closeEditTasks();
      return;
    }
    if (e.target.id === "edit-tasks-overlay") {
      closeEditTasks();
      return;
    }
    // Cycle editor: close button or backdrop
    if (e.target.closest("[data-cycle-close]")) {
      e.preventDefault();
      closeCycleEditor();
      return;
    }
    if (e.target.id === "cycle-overlay") {
      closeCycleEditor();
      return;
    }
    // Start cycle button (admin only, on stat cards). Must come BEFORE the
    // stat-card click handler so the button click doesn't open the detail view.
    const startBtn = e.target.closest("[data-cycle-start]");
    if (startBtn) {
      e.preventDefault();
      e.stopPropagation();
      openCycleEditor(startBtn.dataset.cycleStart);
      return;
    }
    // Cycle line on stat card: admin click opens editor; staff click falls through to detail view.
    const cycLine = e.target.closest(".cycle-line");
    if (cycLine && currentRole === "admin") {
      const stat = cycLine.closest(".stat.clickable");
      if (stat && stat.dataset.job) {
        e.preventDefault();
        e.stopPropagation();
        openCycleEditor(stat.dataset.job);
        return;
      }
    }
    // Detail view: filter buttons
    const filterBtn = e.target.closest("[data-filter]");
    if (filterBtn && ui.detailJob) {
      ui.detailFilter = filterBtn.dataset.filter;
      renderDetail();
      return;
    }
    // Detail view: room chip toggle
    const chip = e.target.closest(".room-chip");
    if (chip) {
      toggle(chip.dataset.tower, +chip.dataset.room, chip.dataset.job);
      return;
    }
    // Open detail view by clicking a task stat card
    const stat = e.target.closest(".stat.clickable");
    if (stat && stat.dataset.job) {
      openDetail(stat.dataset.job);
      return;
    }
    // Column toggle (Select all / Clear all button) — keep its own behavior
    const colBtn = e.target.closest(".col-toggle");
    if (colBtn) {
      e.preventDefault();
      toggleJobColumn(colBtn.dataset.job);
      return;
    }
    // Tapping anywhere else on a task column header opens the task detail view.
    // (Excludes the Clear/Select all button above; that block returns early.)
    const taskTh = e.target.closest("th.task-th");
    if (taskTh && taskTh.dataset.taskDetail) {
      e.preventDefault();
      openDetail(taskTh.dataset.taskDetail);
      return;
    }
    // Checkbox toggle
    const cb = e.target.closest("label.cb");
    if (!cb) return;
    e.preventDefault();
    toggle(cb.dataset.tower, +cb.dataset.room, cb.dataset.job);
  });

  // Initial render with empty data so the UI shows immediately
  renderAll();

  // Re-render on viewport breakpoint changes so mobile/desktop layout switches
  // when rotating a phone or resizing a window.
  if (window.matchMedia) {
    const mq = window.matchMedia("(max-width: 480px)");
    const mqHandler = () => renderAll();
    if (mq.addEventListener) mq.addEventListener("change", mqHandler);
    else if (mq.addListener) mq.addListener(mqHandler);
  }
</script>
</body>
</html>
